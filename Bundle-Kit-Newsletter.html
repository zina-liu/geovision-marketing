  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

99px;padding:6px 14px\">Bundle Kit Solution<\u002Fdiv>\n        <h1 style=\"margin:18px 0 0;font-weight:400;font-size:clamp(28px,6.4vw,40px);line-height:1.2;color:#fff;text-wrap:balance\">Complete Access Control Bundles for Every Need<\u002Fh1>\n        <p style=\"margin:16px auto 0;max-width:540px;font-weight:300;font-size:16px;line-height:1.6;color:#d4def0;text-wrap:pretty\">Simplify your security management with GeoVision's all-in-one bundled solutions. From single-door cloud-managed systems to enterprise-grade multi-door deployments, we have you covered.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:22px\">\n          <a href=\"#kit-1\" style=\"font-size:14px;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:8px 14px\">1-Door Cloud<\u002Fa>\n          <a href=\"#kit-2\" style=\"font-size:14px;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:8px 14px\">2-Door<\u002Fa>\n          <a href=\"#kit-4\" style=\"font-size:14px;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:8px 14px\">4-Door<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"margin:28px auto 0;max-width:600px;background:#fff;border-radius:12px 12px 0 0;padding:24px 0 20px;display:flex;justify-content:center\">\n          <img src=\"55187c8a-9aaf-4626-b3ce-5aa6591cb8fb\" alt=\"GeoVision access control bundle\" style=\"width:76%;max-width:440px;height:auto\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ heroLight }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"02 Hero\" style=\"background:#f5f6f8;padding:40px 24px 32px;text-align:center\">\n        <div style=\"font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#0879df\">Bundle Kit Solution<\u002Fdiv>\n        <h1 style=\"margin:14px 0 0;font-weight:400;font-size:clamp(28px,6.4vw,40px);line-height:1.2;color:#222;text-wrap:balance\">Complete Access Control Bundles for <span style=\"color:#0879df\">Every Need<\u002Fspan><\u002Fh1>\n        <div style=\"margin:18px auto 0;width:100px;height:3px;background:#0879df\"><\u002Fdiv>\n        <p style=\"margin:18px auto 0;max-width:540px;font-weight:300;font-size:16px;line-height:1.6;color:#656565;text-wrap:pretty\">Simplify your security management with GeoVision's all-in-one bundled solutions. From single-door cloud-managed systems to enterprise-grade multi-door deployments, we have you covered.<\u002Fp>\n        <div style=\"margin:24px auto 0;max-width:600px;background:#fff;border:1px solid #e3e7ee;border-radius:12px;padding:24px 0;display:flex;justify-content:center\">\n          <img src=\"55187c8a-9aaf-4626-b3ce-5aa6591cb8fb\" alt=\"GeoVision access control bundle\" style=\"width:76%;max-width:440px;height:auto\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"padding:40px 20px 8px;text-align:center\">\n      <h2 style=\"margin:0;font-weight:400;font-size:clamp(24px,5.4vw,30px);line-height:1.25;color:#222\">Choose Your Bundle Kit<\u002Fh2>\n      <div style=\"position:relative;margin:18px auto 0;max-width:600px;height:3px\">\n        <div style=\"position:absolute;left:0;right:0;top:1px;height:1px;background:#dfe3ea\"><\u002Fdiv>\n        <div style=\"position:relative;margin:0 auto;width:100px;height:3px;background:#0879df\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"kit-1\" data-screen-label=\"03 1-Door Kit\" style=\"padding:20px 16px 0\">\n      <div style=\"background:#f5f6f8;border:1px solid #e3e7ee;border-radius:12px;overflow:hidden\">\n        <div style=\"padding:24px 18px 16px;text-align:center\">\n          <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#0879df\">Kit 01<\u002Fdiv>\n          <h3 style=\"margin:8px 0 0;font-weight:400;font-size:clamp(21px,4.8vw,26px);line-height:1.3;color:#222\">1-Door Cloud Access Control Kit<\u002Fh3>\n          <p style=\"margin:6px 0 0;font-weight:300;font-size:16px;line-height:1.45;color:#0879df\">Smart, Cloud-Managed, All-in-One Security Solution<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"margin:0 14px;background:#fff;border-radius:8px;padding:20px 0;display:flex;justify-content:center\">\n          <img src=\"dbc9ca6b-7957-474b-ab69-739bb5013e6a\" alt=\"1-Door Cloud Access Control Kit\" style=\"width:72%;max-width:420px;height:auto\">\n        <\u002Fdiv>\n        <div style=\"margin:20px 18px 0;border-top:1px dashed #cfd5df\"><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px;padding:18px 18px 0;font-weight:300;font-size:15px;line-height:1.6;color:#656565\">\n          <div style=\"display:flex;gap:10px\"><span style=\"flex:none;width:5px;height:5px;margin-top:10px;border-radius:50%;background:#0879df\"><\u002Fspan><span><span style=\"color:#0879df;font-weight:400\">All-in-One Design:<\u002Fspan> Seamlessly combines a 1-door controller, reader, camera, and intercom into a single compact device (GV-IA1330) for effortless installation.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:10px\"><span style=\"flex:none;width:5px;height:5px;margin-top:10px;border-radius:50%;background:#0879df\"><\u002Fspan><span><span style=\"color:#0879df;font-weight:400\">Cloud Centralized Management:<\u002Fspan> Powered by GV-Cloud, featuring real-time event notifications, centralized monitoring, log search, and emergency lockdown capability.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:10px\"><span style=\"flex:none;width:5px;height:5px;margin-top:10px;border-radius:50%;background:#0879df\"><\u002Fspan><span><span style=\"color:#0879df;font-weight:400\">HD Video Intercom &amp; Local Storage:<\u002Fspan> 2MP (1920 x 1080) video with H.265 compression and Micro SD local storage support.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:10px\"><span style=\"flex:none;width:5px;height:5px;margin-top:10px;border-radius:50%;background:#0879df\"><\u002Fspan><span><span style=\"color:#0879df;font-weight:400\">Ready-to-Use Bundle:<\u002Fspan> Includes the H.265 IP Video Intercom, 25 pcs of GV-AS ID Cards (13.56 MHz ISO 14443A), and a 1-Year GV-Cloud Access Control Subscription.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div data-screen-label=\"03b 1-Year Subscription\" style=\"margin:20px 14px 0;padding:22px 18px 24px;background:#fff;border-radius:8px\">\n          <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#656565\">Included in this kit<\u002Fdiv>\n          <div style=\"margin-top:6px;font-weight:500;font-size:clamp(18px,4.6vw,24px);line-height:1.25;color:#222\">GV-Cloud Access Control Subscription<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin-top:14px\">\n            <div style=\"font-family:'Barlow Condensed',Rubik,Arial,sans-serif;font-weight:800;font-size:clamp(68px,19vw,112px);line-height:.85;color:#0879df\">1 YEAR<\u002Fdiv>\n            <div style=\"align-self:stretch;width:1px;background:#bfc6d2\"><\u002Fdiv>\n            <div style=\"font-weight:300;font-size:clamp(15px,4vw,20px);line-height:1.3;color:#444\"><div style=\"font-weight:500;color:#222\">GV-Cloud<\u002Fdiv>Log + Video Snapshot<br>Subscription.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin:20px 14px 18px;background:#eaf2fc;border-radius:8px;padding:12px 14px;font-size:15px;line-height:1.5;color:#222\"><span style=\"color:#0879df\">Ideal For:<\u002Fspan> Small offices, retail stores, clinics, and standalone entrances.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"kit-2\" data-screen-label=\"04 2-Door Kit\" style=\"padding:20px 16px 0\">\n      <div style=\"background:#f5f6f8;border:1px solid #e3e7ee;border-radius:12px;overflow:hidden\">\n        <div style=\"padding:24px 18px 16px;text-align:center\">\n          <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#0879df\">Kit 02<\u002Fdiv>\n          <h3 style=\"margin:8px 0 0;font-weight:400;font-size:clamp(21px,4.8vw,26px);line-height:1.3;color:#222\">2-Door Access Control Kit<\u002Fh3>\n          <p style=\"margin:6px 0 0;font-weight:300;font-size:16px;line-height:1.45;color:#0879df\">Enterprise-Grade Reliability &amp; Seamless Video Integration<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"margin:0 14px;background:#fff;border-radius:8px;padding:20px 0;display:flex;justify-content:center\">\n          <img src=\"d592adbf-dcb4-4c91-8828-46c0a30eb493\" alt=\"2-Door Access Control Kit\" style=\"width:72%;max-width:420px;height:auto\">\n        <\u002Fdiv>\n        <div style=\"margin:20px 18px 0;border-top:1px dashed #cfd5df\"><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px;padding:18px 18px 0;font-weight:300;font-size:15px;line-height:1.6;color:#656565\">\n          <div style=\"display:flex;gap:10px\"><span style=\"flex:none;width:5px;height:5px;margin-top:10px;border-radius:50%;background:#0879df\"><\u002Fspan><span><span style=\"color:#0879df;font-weight:400\">Complete 2-Door Hardware Bundle:<\u002Fspan> Includes 1x GV-AS2120 controller panel, 2x GV-R1355 card readers, and 25 pcs of GV-AS ID Cards.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:10px\"><span style=\"flex:none;width:5px;height:5px;margin-top:10px;border-radius:50%;background:#0879df\"><\u002Fspan><span><span style=\"color:#0879df;font-weight:400\">Flexible Access Control:<\u002Fspan> Supports 2-door two-way or 4-door one-way control; equipped with 8 digital inputs and 8 relay outputs for gates and doors.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:10px\"><span style=\"flex:none;width:5px;height:5px;margin-top:10px;border-radius:50%;background:#0879df\"><\u002Fspan><span><span style=\"color:#0879df;font-weight:400\">Video Integration:<\u002Fspan> Seamlessly integrates with GV-VMS video analytics and surveillance systems; features built-in tamper alarm and PoE+ support.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:10px\"><span style=\"flex:none;width:5px;height:5px;margin-top:10px;border-radius:50%;background:#0879df\"><\u002Fspan><span><span style=\"color:#0879df;font-weight:400\">Comprehensive Remote Management:<\u002Fspan> Comes with free GV-ASManager software (supports up to 4 controllers), GV-ASWeb interface, and GV-Access mobile app.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin:20px 14px 18px;background:#eaf2fc;border-radius:8px;padding:12px 14px;font-size:15px;line-height:1.5;color:#222\"><span style=\"color:#0879df\">Ideal For:<\u002Fspan> Medium-sized offices and dual-entrance control.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"kit-4\" data-screen-label=\"05 4-Door Kit\" style=\"padding:20px 16px 0\">\n      <div style=\"background:#f5f6f8;border:1px solid #e3e7ee;border-radius:12px;overflow:hidden\">\n        <div style=\"padding:24px 18px 16px;text-align:center\">\n          <div style=\"font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#0879df\">Kit 03<\u002Fdiv>\n          <h3 style=\"margin:8px 0 0;font-weight:400;font-size:clamp(21px,4.8vw,26px);line-height:1.3;color:#222\">4-Door Access Control Kit<\u002Fh3>\n          <p style=\"margin:6px 0 0;font-weight:300;font-size:16px;line-height:1.45;color:#0879df\">Unified Security Management for Multi-Door Facilities<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"margin:0 14px;background:#fff;border-radius:8px;padding:20px 0;display:flex;justify-content:center\">\n          <img src=\"55187c8a-9aaf-4626-b3ce-5aa6591cb8fb\" alt=\"4-Door Access Control Kit\" style=\"width:72%;max-width:420px;height:auto\">\n        <\u002Fdiv>\n        <div style=\"margin:20px 18px 0;border-top:1px dashed #cfd5df\"><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px;padding:18px 18px 0;font-weight:300;font-size:15px;line-height:1.6;color:#656565\">\n          <div style=\"display:flex;gap:10px\"><span style=\"flex:none;width:5px;height:5px;margin-top:10px;border-radius:50%;background:#0879df\"><\u002Fspan><span><span style=\"color:#0879df;font-weight:400\">Unified Multi-Door Security:<\u002Fspan> Designed for multi-door facilities to streamline deployment with a complete 4-door hardware bundle.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:10px\"><span style=\"flex:none;width:5px;height:5px;margin-top:10px;border-radius:50%;background:#0879df\"><\u002Fspan><span><span style=\"color:#0879df;font-weight:400\">High-Protection Readers &amp; Cards:<\u002Fspan> Includes 4x GV-R1355 readers featuring IP66 weatherproofing, OSDP communication, and DESFire card support, plus 25 pcs of GV-AS ID Cards.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;gap:10px\"><span style=\"flex:none;width:5px;height:5px;margin-top:10px;border-radius:50%;background:#0879df\"><\u002Fspan><span><span style=\"color:#0879df;font-weight:400\">Full-Featured Surveillance Integration:<\u002Fspan> Integrates directly with GV-VMS for video-verified access events, all managed centrally via GV-ASManager, GV-ASWeb, and GV-Access App.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin:20px 14px 18px;background:#eaf2fc;border-radius:8px;padding:12px 14px;font-size:15px;line-height:1.5;color:#222\"><span style=\"color:#0879df\">Ideal For:<\u002Fspan> Large enterprise offices, multi-floor buildings, and manufacturing facilities.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-screen-label=\"06 Optional Readers\" style=\"padding:44px 16px 0\">\n      <div style=\"text-align:center;padding:0 4px\">\n        <h2 style=\"margin:0;font-weight:400;font-size:clamp(24px,5.4vw,30px);line-height:1.25;color:#222;text-wrap:balance\">Customize Your Kit with Optional Readers<\u002Fh2>\n        <div style=\"position:relative;margin:18px auto 0;max-width:600px;height:3px\">\n          <div style=\"position:absolute;left:0;right:0;top:1px;height:1px;background:#dfe3ea\"><\u002Fdiv>\n          <div style=\"position:relative;margin:0 auto;width:100px;height:3px;background:#0879df\"><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:18px auto 0;max-width:560px;font-weight:300;font-size:15px;line-height:1.6;color:#656565;text-wrap:pretty\">Tailor your security system to fit your facility’s specific access and aesthetic requirements with our versatile optional readers:<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px;margin-top:22px\">\n        <div style=\"background:#eef3fb;border:1px solid #d6e2f3;border-radius:12px;padding:20px 18px\">\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px\">\n            <h4 style=\"margin:0;font-weight:400;font-size:18px;line-height:1.35;color:#222\">Scrambled Keypad + Reader<\u002Fh4>\n            <span style=\"font-size:13px;color:#656565;background:#fff;border:1px solid #d6e2f3;border-radius:999px;padding:4px 12px\">GV-RKR1355<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:10px 0 0;font-weight:300;font-size:15px;line-height:1.6;color:#656565\">Features a randomized keypad PIN layout on each access attempt to prevent shoulder surfing and fingerprint tracking. Combines RFID card reading with multi-factor authentication (Card + PIN) to secure high-security areas like server rooms and financial departments.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#eef3fb;border:1px solid #d6e2f3;border-radius:12px;padding:20px 18px\">\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px\">\n            <h4 style=\"margin:0;font-weight:400;font-size:18px;line-height:1.35;color:#222\">QR Code &amp; Mobile Access Reader<\u002Fh4>\n            <span style=\"font-size:13px;color:#656565;background:#fff;border:1px solid #d6e2f3;border-radius:999px;padding:4px 12px\">GV-QR1352<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:10px 0 0;font-weight:300;font-size:15px;line-height:1.6;color:#656565\">Features QR code scanning and contactless access capabilities, an ideal solution for modern visitor management, temporary pass issuance, and smart office environments.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#eef3fb;border:1px solid #d6e2f3;border-radius:12px;padding:20px 18px\">\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px\">\n            <h4 style=\"margin:0;font-weight:400;font-size:18px;line-height:1.35;color:#222\">DESFire Keypad Reader<\u002Fh4>\n            <span style=\"font-size:13px;color:#656565;background:#fff;border:1px solid #d6e2f3;border-radius:999px;padding:4px 12px\">GV-RKD1352<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:10px 0 0;font-weight:300;font-size:15px;line-height:1.6;color:#656565\">Supports high-security MIFARE DESFire cards along with a built-in keypad, offering durable Card + PIN multi-factor access control in a compact reader form factor.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-screen-label=\"07 About GeoVision\" style=\"margin-top:44px;padding:36px 20px 40px;background:#f5f6f8\">\n      <div style=\"font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#0879df\">About GeoVision<\u002Fdiv>\n      <p style=\"margin:12px 0 0;font-weight:500;font-size:clamp(18px,4.4vw,22px);line-height:1.4;color:#222;text-wrap:pretty\">GeoVision is a global Enterprise VMS provider and Application Specialist for Critical Infrastructure.<\u002Fp>\n      <div style=\"margin-top:20px;background:#fff;border:1px solid #e3e7ee;border-radius:12px;padding:20px 18px\">\n        <div style=\"font-size:16px;line-height:1.35;color:#0879df\">Service &amp; Reliability<\u002Fdiv>\n        <p style=\"margin:8px 0 0;font-weight:300;font-size:15px;line-height:1.6;color:#656565\">GeoVision is a global application specialist dedicated to mission critical security. We provide 10 hour US based phone support and 24/5 live chat to ensure system uptime for our enterprise partners in transportation, healthcare, and public sectors.<\u002Fp>\n      <\u002Fdiv>\n      <img src=\"8e500770-1892-44c4-ac8d-e64bee6a52ee\" alt=\"GeoVision\" style=\"margin:24px 0 0 auto;width:130px;height:auto;mix-blend-mode:multiply\">\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;heroStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Navy&quot;,&quot;Light&quot;],&quot;default&quot;:&quot;Navy&quot;,&quot;tsType&quot;:&quot;'Navy'|'Light'&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const hero = this.props.heroStyle ?? 'Navy';\n    return { heroNavy: hero === 'Navy', heroLight: hero === 'Light' };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
