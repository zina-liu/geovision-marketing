<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoVision Marketing Monthly Report</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="reports.css">
</head>
<body>
    <aside class="sidebar" aria-label="Marketing report navigation">
        <a class="brand" href="#report">
            <img class="brand-logo" src="logo/logo small.png" alt="GeoVision">
            <span>Marketing Hub</span>
        </a>

        <nav class="nav-group" aria-label="Monthly reports">
            <div class="nav-label">Monthly Reports</div>
            <div id="month-nav" class="month-nav"></div>
        </nav>

        <nav class="nav-group" aria-label="Resources">
            <div class="nav-label">Resources</div>
            <button class="nav-item secondary" type="button" data-view="workspace">Team Workspace</button>
        </nav>

        <div class="sidebar-actions">
            <button id="report-mode-toggle" class="mode-button" type="button">Report Mode</button>
            <div class="language-switch">
                <a href="index.html" class="active">EN</a><span>|</span><a href="zh.html">繁中</a>
            </div>
        </div>
    </aside>

    <main class="main-container">
        <button id="report-mode-exit" class="report-exit-button" type="button">Exit Report Mode</button>
        <section id="report-view" class="view active" aria-live="polite">
            <div class="report-stage">
                <div class="bg-shape bg-shape-1"></div>
                <div class="bg-shape bg-shape-2"></div>
                <div class="bg-shape bg-shape-3"></div>
                <article id="report" class="presentation"></article>
            </div>
        </section>

        <section id="workspace-view" class="view" aria-live="polite">
            <div class="workspace-panel">
                <h1>Team Workspace</h1>
                <div id="lock-section" class="workspace-card">
                    <div id="lock-screen">
                        <p>GV Team Password</p>
                        <input type="password" id="pass-input" placeholder="Password">
                        <button class="primary-button" type="button" onclick="checkPass()">Enter</button>
                    </div>
                    <div id="internal-links" class="workspace-links" hidden>
                        <a href="https://zina-liu.github.io/geovision-marketing/case-study-form.html" target="_blank" rel="noopener">
                            <span>Form</span>
                            <strong>Submit Case Study</strong>
                            <small>Fill out project details here.</small>
                        </a>
                        <a href="https://pse.is/event-update" target="_blank" rel="noopener">
                            <span>Form</span>
                            <strong>Event Updates</strong>
                            <small>Update your trade shows and events here.</small>
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        window.REPORT_LANGUAGE = 'en';
    </script>
    <script src="reports-data.js"></script>
    <script src="reports-app.js"></script>
</body>
</html>
