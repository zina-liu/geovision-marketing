<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="GeoVision AI-powered security roll-up display">
    <title>GeoVision AI-Powered Security</title>
    <style>
      :root {
        color-scheme: dark;
        background: #0d0d0d;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        display: flex;
        justify-content: center;
        background: #0d0d0d;
      }

      main {
        width: min(88vw, 900px);
        padding: clamp(16px, 3vw, 36px) 0;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
      }

      @media (max-width: 600px) {
        main {
          width: 94vw;
          padding: 12px 0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img
        src="../roll-up-v2-updated-images-v3.png"
        alt="GeoVision AI-powered security solutions display"
      >
    </main>
  </body>
</html>
