<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoVision 行銷月報</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="reports.css">
</head>
<body>
    <aside class="sidebar" aria-label="行銷月報導覽">
        <a class="brand" href="#report">
            <img class="brand-logo" src="logo/logo small.png" alt="GeoVision">
            <span>Marketing Hub</span>
        </a>

        <nav class="nav-group" aria-label="月份報告">
            <div class="nav-label">行銷月報</div>
            <div id="month-nav" class="month-nav"></div>
        </nav>

        <nav class="nav-group" aria-label="團隊工作區">
            <div class="nav-label">團隊工作區</div>
            <button class="nav-item secondary" type="button" data-view="workspace">資訊交流</button>
        </nav>

        <div class="sidebar-actions">
            <button id="report-mode-toggle" class="mode-button" type="button">開啟報告模式</button>
            <div class="language-switch">
                <a href="index.html">EN</a><span>|</span><a href="zh.html" class="active">繁中</a>
            </div>
        </div>
    </aside>

    <main class="main-container">
        <button id="report-mode-exit" class="report-exit-button" type="button">離開報告模式</button>
        <section id="hub-view" class="view active" aria-live="polite">
            <div class="hub-panel">
                <header class="hub-hero">
                    <div>
                        <p class="eyebrow">Marketing Hub</p>
                        <h1>每月行銷紀錄</h1>
                        <p>平常用來查閱每月更新和歷史紀錄；需要開會報告時，再把選定月份切成完整報告模式。</p>
                    </div>
                    <button class="primary-button open-report-button" type="button" data-action="open-report">開啟報告模式</button>
                </header>
                <section id="selected-record" class="selected-record"></section>
                <section class="archive-section">
                    <div class="section-heading">
                        <p class="eyebrow">Archive</p>
                        <h2>月報紀錄</h2>
                    </div>
                    <div id="archive-grid" class="archive-grid"></div>
                </section>
            </div>
        </section>

        <section id="report-view" class="view" aria-live="polite">
            <div class="report-stage">
                <div class="bg-shape bg-shape-1"></div>
                <div class="bg-shape bg-shape-2"></div>
                <div class="bg-shape bg-shape-3"></div>
                <article id="report" class="presentation"></article>
            </div>
        </section>

        <section id="workspace-view" class="view" aria-live="polite">
            <div class="workspace-panel">
                <h1>資訊交流</h1>
                <div id="lock-section" class="workspace-card">
                    <div id="lock-screen">
                        <p>GV 團隊密碼</p>
                        <input type="password" id="pass-input" placeholder="密碼">
                        <button class="primary-button" type="button" onclick="checkPass()">進入</button>
                    </div>
                    <div id="internal-links" class="workspace-links" hidden>
                        <a href="https://zina-liu.github.io/geovision-marketing/case-study-form-zh.html" target="_blank" rel="noopener">
                            <span>表單</span>
                            <strong>提交 Case Study</strong>
                            <small>在這裡填寫專案資訊。</small>
                        </a>
                        <a href="https://pse.is/event-update" target="_blank" rel="noopener">
                            <span>表單</span>
                            <strong>參展資訊更新</strong>
                            <small>在這裡更新你的展會與活動資訊。</small>
                        </a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        window.REPORT_LANGUAGE = 'zh';
    </script>
    <script src="reports-data.js"></script>
    <script src="reports-app.js"></script>
</body>
</html>
